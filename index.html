<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1315">
<meta name="color-scheme" content="dark light">
<title>DiagPhone</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Concept : tableau de bord d'atelier de réparation. Un cadran à graduations donne le score de santé,
   chaque composant est une ligne de contrôle avec son voyant. Accent orange "signal" sur fond vert-noir. */
:root{
  --bg:#0A1315; --panel:#101D20; --panel2:#17292D; --line:#23393E;
  --fg:#E7F0F1; --muted:#8CA5AA; --accent:#FF8B3D; --accent-ink:#1A0C03;
  --good:#46D68C; --warn:#F5C542; --bad:#FF6464; --info:#5CC8FF;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF3F3; --panel:#FFFFFF; --panel2:#E4ECEC; --line:#CCD9DA;
    --fg:#0F2124; --muted:#587076; --accent:#D9500A; --accent-ink:#FFFFFF;
    --good:#12834B; --warn:#8F6200; --bad:#C62828; --info:#0A6FA8; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF3F3; --panel:#FFFFFF; --panel2:#E4ECEC; --line:#CCD9DA;
  --fg:#0F2124; --muted:#587076; --accent:#D9500A; --accent-ink:#FFFFFF;
  --good:#12834B; --warn:#8F6200; --bad:#C62828; --info:#0A6FA8; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.center{text-align:center}

/* header */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand svg{width:28px;height:28px;color:var(--accent)}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--panel)}
.icon-btn svg{width:20px;height:20px}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;color:var(--muted);font-size:12px;font-weight:500}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* generic blocks */
main{padding-block:18px 8px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.sect{display:flex;flex-direction:column;gap:10px}
.sect>h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-family:var(--body);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;
  font-weight:600;border:1px solid var(--line);background:var(--panel2)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.good{background:color-mix(in srgb,var(--good) 18%,var(--panel));border-color:color-mix(in srgb,var(--good) 55%,transparent);color:var(--good)}
.btn.bad{background:color-mix(in srgb,var(--bad) 14%,var(--panel));border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn-row>.btn{flex:1 1 140px}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.gauge{position:relative;width:176px;height:176px;flex:none}
.gauge svg{width:100%;height:100%;display:block}
.gauge .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.gauge .num{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.gauge .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.hero h1{font-size:25px}
.hero .meta{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero .meta p{color:var(--muted);font-size:14px}
@media (max-width:480px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .btn-row{justify-content:center;width:100%}}

.banner{display:flex;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);
  background:color-mix(in srgb,var(--warn) 10%,var(--panel));font-size:14px}
.banner b{color:var(--warn)}
.banner svg{width:22px;height:22px;flex:none;color:var(--warn)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-width:0}
.tile svg{width:26px;height:26px;color:var(--accent)}
.tile b{font-family:var(--display);font-size:16px}
.tile small{color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.pass{background:var(--good)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--bad)}.dot.skip{background:var(--muted);opacity:.5}

/* list rows */
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:13px 14px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;color:var(--accent)}
.row .ic svg{width:22px;height:22px}
.row .tx{min-width:0}
.row .tx b{display:block;font-weight:600}
.row .tx span{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.pass{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.fail{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipbtn{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:500;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* key-value */
.kv{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.kv>div{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.kv>div:last-child{border-bottom:0}
.kv dt,.kv .k{color:var(--muted)}
.kv .v{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere;text-align:right}
.kv .v.pass{color:var(--good)}.kv .v.warn{color:var(--warn)}.kv .v.fail{color:var(--bad)}

/* runner */
#runner{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#runner[hidden]{display:none}
.r-head{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.r-title{min-width:0}
.r-title small{display:block;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.r-title h2{font-size:21px}
.r-prog{height:3px;background:var(--line)}
.r-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.r-body{flex:1;overflow:auto;padding:16px;max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.r-foot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel);max-width:none}
.r-foot .btn{flex:1}
.hint{color:var(--muted);font-size:14px}
.sub{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-family:var(--body);font-weight:600}
.note{padding:12px 14px;border-radius:12px;font-size:14px;background:var(--panel);border:1px solid var(--line)}
.note.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent);color:var(--fg);background:color-mix(in srgb,var(--warn) 9%,var(--panel))}
.note.bad{border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad) 9%,var(--panel))}
.note.good{border-color:color-mix(in srgb,var(--good) 55%,transparent);background:color-mix(in srgb,var(--good) 9%,var(--panel))}
.verdict{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.verdict b{font-family:var(--display);font-size:18px;display:block}
.verdict.pass{border-color:var(--good)}.verdict.pass b{color:var(--good)}
.verdict.warn{border-color:var(--warn)}.verdict.warn b{color:var(--warn)}
.verdict.fail{border-color:var(--bad)}.verdict.fail b{color:var(--bad)}
.verdict.skip b{color:var(--muted)}
.big-num{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.meter{height:12px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:14px 0 10px}
.meter i{display:block;height:100%;width:0;background:var(--good);transition:width .4s,background .4s;border-radius:99px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.cover{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:24px;font-family:var(--mono);font-size:13px;user-select:none;touch-action:manipulation}
.cover span{mix-blend-mode:difference;color:#fff}
.grid-touch{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;touch-action:none;user-select:none;aspect-ratio:6/10;max-height:62vh;margin-inline:auto;width:100%;max-width:380px}
.grid-touch i{background:var(--panel2);border-radius:4px;transition:background .1s}
.grid-touch i.on{background:var(--accent)}
.pad{position:relative;touch-action:none;user-select:none;height:min(52vh,420px);border-radius:18px;border:1px dashed var(--line);background:var(--panel);overflow:hidden}
.pad .t{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:color-mix(in srgb,var(--accent) 35%,transparent);border:2px solid var(--accent);display:grid;place-items:center;font-family:var(--mono);font-weight:500;pointer-events:none}
.pad .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px;pointer-events:none}
canvas.vis{width:100%;height:140px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:block}
video.cam{width:100%;max-height:48vh;background:#000;border-radius:16px;object-fit:contain}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.level{position:relative;width:132px;height:132px;border-radius:50%;border:2px solid var(--line);background:var(--panel);flex:none}
.level::before,.level::after{content:"";position:absolute;background:var(--line)}
.level::before{left:50%;top:8px;bottom:8px;width:1px}.level::after{top:50%;left:8px;right:8px;height:1px}
.level .bubble{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--accent);left:50%;top:50%}
.compass{position:relative;width:132px;height:132px;border-radius:50%;border:2px solid var(--line);background:var(--panel);flex:none}
.compass .nd{position:absolute;left:50%;top:50%;width:4px;height:52px;margin:-52px 0 0 -2px;background:linear-gradient(var(--bad) 50%,var(--muted) 50%);transform-origin:50% 100%;border-radius:2px}
.compass b{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.dials{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.spark{width:100%;height:64px;display:block}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:90vw}
.toast[hidden]{display:none}
.codes{display:flex;flex-direction:column;gap:8px}
.code{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.code code{font-family:var(--mono);font-size:15px;color:var(--accent)}
.code span{display:block;color:var(--muted);font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent)}
.sheet-title{display:none}
@media print{
  .top,.nav,.btn,.btn-row,#runner,.toast,.noprint{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card,.rows,.kv{border-color:#bbb;background:#fff}
  .sheet-title{display:block;font-size:22px;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2.5" width="16" height="27" rx="4"/><path d="M12 17h2.5l1.5-4 2.5 8 1.5-4H21"/></svg>
    DiagPhone
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="themeBtn" aria-label="Changer le thème" data-act="theme"></button>
</div></header>

<div class="wrap"><main id="view"></main></div>

<nav class="nav" aria-label="Navigation principale"><div class="wrap" id="nav"></div></nav>

<div id="runner" hidden role="dialog" aria-modal="true" aria-labelledby="r-name">
  <div class="r-head">
    <button class="icon-btn" id="r-back" aria-label="Quitter le test"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="r-title"><small id="r-step"></small><h2 id="r-name"></h2></div>
  </div>
  <div class="r-prog"><i id="r-bar"></i></div>
  <div id="rbody" class="r-body"></div>
  <div id="rfoot" class="r-foot"></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
'use strict';
/* ---------- utilitaires ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('diagphone.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('diagphone.' + k, JSON.stringify(v)); } catch (e) {} }
};
const secure = window.isSecureContext;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const median = a => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : 0; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2400); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copié'); return; } catch (e) {}
  const ta = h('textarea', { style: 'position:fixed;opacity:0' }); ta.value = text; document.body.append(ta); ta.select();
  try { document.execCommand('copy'); toast('Copié'); } catch (e) { toast('Copie impossible'); } ta.remove();
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const ICONS = {
  battery: '<rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M6 10v4M10 10v4"/>',
  screen: '<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10.5 18.5h3"/>',
  touch: '<circle cx="12" cy="12" r="3"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>',
  multitouch: '<circle cx="7.5" cy="8" r="2.5"/><circle cx="16.5" cy="8" r="2.5"/><circle cx="12" cy="16.5" r="2.5"/>',
  speaker: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11"/>',
  mic: '<rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/>',
  camera: '<path d="M3.5 7.5h3l1.8-3h7.4l1.8 3h3v12h-17z"/><circle cx="12" cy="13.5" r="3.8"/>',
  vibrate: '<rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4.5 8v8M19.5 8v8M1.5 10.5v3M22.5 10.5v3"/>',
  sensors: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  gps: '<path d="M12 21.5s7-6.2 7-11.5a7 7 0 10-14 0c0 5.3 7 11.5 7 11.5z"/><circle cx="12" cy="10" r="2.5"/>',
  network: '<path d="M2 9a15 15 0 0120 0M5 12.5a10.5 10.5 0 0114 0M8.5 16a5 5 0 017 0"/><circle cx="12" cy="19.5" r=".8"/>',
  connect: '<path d="M7 7.5l10 9-5 5v-19l5 5-10 9"/>',
  bio: '<path d="M12 3.5a7 7 0 00-7 7V13M12 7.5a3 3 0 00-3 3V16M12 11v7M16 10.5V14a8 8 0 01-1.5 4.7M19 11.5v1"/>',

function tPerf(c) {
  const b = c.body, out = h('div'), prog = h('p', { class: 'mono center muted' }); let workers = [];
  const src = `onmessage=e=>{const d=e.data;if(d.mode==='bench'){const t=performance.now();let x=0;for(let i=1;i<=2e7;i++){x+=Math.sqrt(i)*Math.sin(i);}postMessage({ms:performance.now()-t,x});}else{const end=performance.now()+d.ms;let tick=performance.now(),n=0,x=0;while(performance.now()<end){for(let i=1;i<=200000;i++){x+=Math.sqrt(i)*Math.sin(i);}n++;const now=performance.now();if(now-tick>=1000){postMessage({tick:n});n=0;tick=now;}}postMessage({done:1,x});}}`;
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  const spawn = n => Array.from({ length: n }, () => { const w = new Worker(url); workers.push(w); return w; });
  const kill = () => { workers.forEach(w => w.terminate()); workers = []; };
  c.onCleanup(() => { kill(); URL.revokeObjectURL(url); });
  const bench = n => new Promise(res => { const ws = spawn(n), ms = []; ws.forEach(w => { w.onmessage = e => { ms.push(e.data.ms); if (ms.length === n) { res(Math.max(...ms)); ws.forEach(x => x.terminate()); } }; w.postMessage({ mode: 'bench' }); }); });
  const stress = (n, dur) => new Promise(res => { const ws = spawn(n), ticks = ws.map(() => []); let fin = 0;
    ws.forEach((w, i) => { w.onmessage = e => { if (e.data.tick != null) ticks[i].push(e.data.tick); if (e.data.done) { fin++; if (fin === n) { const L = Math.min(...ticks.map(t => t.length)); res(Array.from({ length: L }, (_, k) => ticks.reduce((s, t) => s + t[k], 0))); ws.forEach(x => x.terminate()); } } }; w.postMessage({ mode: 'stress', ms: dur }); }); });
  const refresh = () => new Promise(res => { const d = []; let last = 0; const t0 = performance.now(); const f = t => { if (last) d.push(t - last); last = t; if (t - t0 < 1500) requestAnimationFrame(f); else { const m = median(d), hz = 1000 / m; const std = [30, 48, 60, 72, 90, 120, 144, 165]; res({ hz: std.reduce((a, x) => Math.abs(x - hz) < Math.abs(a - hz) ? x : a), jank: d.filter(x => x > m * 1.5).length / d.length }); } }; requestAnimationFrame(f); });
  const btn = h('button', { class: 'btn primary', onclick: run }, 'Lancer le test (≈ 25 s)');
  b.append(h('p', { class: 'hint' }, 'Mesure la fréquence d’écran, la vitesse du processeur et sa tenue à la chauffe. Laissez l’écran allumé et ne touchez à rien pendant le test.'), btn, prog, out);
  async function run() {
    btn.disabled = true; const cores = clamp(navigator.hardwareConcurrency || 4, 2, 8);
    try {
      prog.textContent = 'Fréquence d’écran…'; const fr = await refresh();
      prog.textContent = 'Processeur, un cœur…'; const one = await bench(1);
      prog.textContent = 'Processeur, ' + cores + ' cœurs…'; const all = await bench(cores);
      prog.textContent = 'Test de chauffe, 12 s…'; const tk = await stress(cores, 12000);
      const k = Math.min(3, Math.floor(tk.length / 3) || 1), a = tk.slice(0, k).reduce((s, x) => s + x, 0) / k, z = tk.slice(-k).reduce((s, x) => s + x, 0) / k, drop = a ? Math.round((1 - z / a) * 100) : 0;
      const s1 = Math.round(2e7 / one / 1000), sm = Math.round(2e7 * cores / all / 1000);
      prog.textContent = '';
      out.replaceChildren(kvBox([['Fréquence d’écran', fr.hz + ' Hz'], ['Fluidité', fr.jank < .05 ? 'régulière' : Math.round(fr.jank * 100) + ' % d’images en retard', fr.jank < .05 ? 'pass' : 'warn'], ['Indice CPU, 1 cœur', s1 + ' Mop/s'], ['Indice CPU, ' + cores + ' cœurs', sm + ' Mop/s'], ['Perte de débit après 12 s', drop + ' %', drop <= 20 ? 'pass' : drop <= 35 ? 'warn' : 'fail'], ['Mémoire annoncée', navigator.deviceMemory ? '≈ ' + navigator.deviceMemory + ' Go (arrondi par le navigateur)' : 'non exposée']]));
      perfData = { hz: fr.hz, s1, sm, drop };
      const bad = drop > 35 || fr.jank > .2;
      c.verdict(bad ? 'warn' : 'pass', 'Écran ' + fr.hz + ' Hz, indice CPU ' + s1 + '/' + sm + ' Mop/s, perte à la chauffe ' + drop + ' %' + (bad ? '. Le téléphone ralentit ou saccade sous charge.' : '.'));
    } catch (e) { prog.textContent = ''; out.replaceChildren(note('bad', 'Test interrompu : ' + e.message)); btn.disabled = false; }
  }
  c.suggest('Performances normales', 'Performances anormales');
  if (c.auto) run();
}

async function tStorage(c) {
  const b = c.body, out = h('div'), btn = h('button', { class: 'btn primary', onclick: run }, 'Mesurer la vitesse d’écriture');
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open('diagphone-test', 1); r.onupgradeneeded = () => r.result.createObjectStore('b'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = (db, mode, fn) => new Promise((res, rej) => { const t = db.transaction('b', mode), r = fn(t.objectStore('b')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  b.append(h('p', { class: 'hint' }, 'Écrit puis relit 24 Mo dans le stockage du navigateur pour mesurer la vitesse de la mémoire flash. Le quota affiché est celui du navigateur, pas l’espace libre exact du téléphone.'), btn, out);
  async function run() {
    btn.disabled = true; out.replaceChildren(note('', 'Mesure en cours…'));
    try {
      const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; const size = 24 * 1024 * 1024, buf = new Uint8Array(size);
      for (let i = 0; i < size; i += 65536) crypto.getRandomValues(buf.subarray(i, Math.min(i + 65536, size)));
      const db = await idb(); let t = performance.now(); await tx(db, 'readwrite', s => s.put(buf, 'k')); const w = 24 / ((performance.now() - t) / 1000);
      t = performance.now(); const back = await tx(db, 'readonly', s => s.get('k')); const r = 24 / ((performance.now() - t) / 1000); const okData = back && back.length === size;
      await tx(db, 'readwrite', s => s.delete('k')); db.close();
      const rows = [['Écriture', w.toFixed(0) + ' Mo/s', w >= 20 ? 'pass' : w >= 5 ? 'warn' : 'fail'], ['Lecture', r.toFixed(0) + ' Mo/s (en partie mise en cache)'], ['Intégrité des données', okData ? 'conforme' : 'ERREUR', okData ? 'pass' : 'fail']];
      if (est) rows.push(['Quota du navigateur', Math.round(est.quota / 1e9 * 10) / 10 + ' Go'], ['Déjà utilisé par DiagPhone', Math.round((est.usage || 0) / 1e6) + ' Mo']);
      out.replaceChildren(kvBox(rows));
      const st = !okData ? 'fail' : w < 5 ? 'warn' : 'pass';
      c.verdict(st, okData ? 'Écriture ' + w.toFixed(0) + ' Mo/s, lecture ' + r.toFixed(0) + ' Mo/s, données intactes.' : 'Les données relues diffèrent de celles écrites : mémoire suspecte.');
    } catch (e) { out.replaceChildren(note('bad', 'Stockage inaccessible : ' + (e.name || e.message))); btn.disabled = false; }
  }
  c.suggest('Stockage fonctionnel', 'Stockage défaillant');
  if (c.auto) run();
}

  { id: 'gps', cat: 'capteurs', title: 'GPS', icon: 'gps', w: 5, mount: tGps },
  { id: 'network', cat: 'reseau', title: 'Réseau et débit', icon: 'network', w: 6, mount: tNetwork },
  { id: 'connect', cat: 'reseau', title: 'Bluetooth et NFC', icon: 'connect', w: 2, mount: tConnect },
  { id: 'bio', cat: 'reseau', title: 'Empreinte et verrou', icon: 'bio', w: 3, mount: tBio },
  { id: 'perf', cat: 'perf', title: 'Processeur, écran et chauffe', icon: 'perf', w: 5, mount: tPerf },
  { id: 'storage', cat: 'perf', title: 'Stockage', icon: 'storage', w: 3, mount: tStorage }
];

/* ---------- exécuteur de tests ---------- */
let R = null, runnerOpen = false, wake = null;
function openRunner() {
  if (!runnerOpen) { runnerOpen = true; try { history.pushState({ r: 1 }, ''); } catch (e) {} }
  $('#runner').hidden = false; document.body.style.overflow = 'hidden';
  if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => wake = l).catch(() => {});
}
function teardown() { if (R) { const cl = R.cleanups; R = null; cl.forEach(f => { try { f(); } catch (e) {} }); } }
function closeRunner(fromPop) {
  teardown(); $('#runner').hidden = true; document.body.style.overflow = '';
  if (wake) { wake.release().catch(() => {}); wake = null; }
  if (runnerOpen) { runnerOpen = false; if (!fromPop) { try { history.back(); } catch (e) {} } }
  render();
}
window.addEventListener('popstate', () => { if (runnerOpen) closeRunner(true); });
$('#r-back').addEventListener('click', () => closeRunner());

function setFooter(mode) {
  const f = $('#rfoot'); f.replaceChildren();
  const mk = (cls, txt, fn) => h('button', { class: 'btn ' + cls, onclick: fn }, txt);
  if (mode === 'manual') f.append(mk('bad', 'Problème', () => finish('fail')), mk('ghost', 'Passer', () => finish('skip')), mk('good', 'Ça marche', () => finish('pass')));
  else f.append(mk('primary', R && R.seq && R.idx < R.seq.length - 1 ? 'Test suivant' : 'Terminer', () => finish(R.v.status, R.v.detail)));
}
function finish(status, detail) {
  if (!R) return;
  const t = R.t, seq = R.seq, idx = R.idx;
  if (detail == null) detail = status === 'pass' ? (R.passMsg || 'Confirmé par vos soins') : status === 'fail' ? (R.failMsg || 'Défaut constaté') : 'Passé sans test';
  results[t.id] = { status, detail, ts: Date.now() }; store.set('results', results);
  teardown();
  if (seq && idx < seq.length - 1) startTest(seq[idx + 1], seq, idx + 1);
  else { closeRunner(); toast(t.title + ' : ' + STATUS[status].toLowerCase()); }
}
async function startTest(id, seq, idx) {
  teardown();
  const t = TESTS.find(x => x.id === id); if (!t) return;
  idx = idx || 0;
  const body = $('#rbody'); body.replaceChildren();
  R = { t, seq: seq || null, idx, cleanups: [], passMsg: '', failMsg: '', v: null };
  const my = R;
  $('#r-name').textContent = t.title;
  $('#r-step').textContent = seq ? 'Test ' + (idx + 1) + ' sur ' + seq.length : (CATS.find(c => c.id === t.cat) || {}).name;
  $('#r-bar').style.width = seq ? ((idx) / seq.length * 100) + '%' : '0';
  setFooter('manual'); openRunner(); body.scrollTop = 0;
  const ctx = {
    body, auto: !!seq,
    onCleanup(fn) { my.cleanups.push(fn); },
    suggest(pass, fail) { if (R !== my) return; if (pass) my.passMsg = pass; if (fail) my.failMsg = fail; },
    verdict(status, detail) {
      if (R !== my) return; my.v = { status, detail };
      $$('.verdict', body).forEach(x => x.remove());
      body.append(h('div', { class: 'verdict ' + status, html: '<div style="width:28px;color:' + colorOf(status === 'pass' ? 'good' : status === 'warn' ? 'warn' : status === 'fail' ? 'bad' : '') + '">' + icon(status === 'pass' ? 'check' : 'warn') + '</div>' }, h('div', {}, h('b', {}, STATUS[status] === 'Non testé' ? 'Non testable ici' : STATUS[status]), h('span', { class: 'muted' }, detail))));
      setFooter('verdict'); body.scrollTop = body.scrollHeight;
    }
  };
  try { await t.mount(ctx); } catch (e) { if (R === my) body.append(note('bad', 'Erreur pendant le test : ' + e.message)); }
}
function runSequence(onlyMissing) {
  const ids = TESTS.filter(t => !onlyMissing || !results[t.id] || results[t.id].status === 'skip').map(t => t.id);
  if (!ids.length) { toast('Tout est déjà testé'); return; }
  startTest(ids[0], ids, 0);
}

/* ---------- informations appareil ---------- */
function gpuInfo() {
  try { const cv = document.createElement('canvas'), gl = cv.getContext('webgl') || cv.getContext('experimental-webgl'); if (!gl) return null; const e = gl.getExtension('WEBGL_debug_renderer_info'); return { renderer: e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER), vendor: e ? gl.getParameter(e.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR) }; } catch (e) { return null; }
}
async function gatherInfo() {
  let he = {}; try { he = (navigator.userAgentData && await navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion', 'architecture', 'bitness'])) || {}; } catch (e) {}
  const ua = navigator.userAgent, m = /Android [\d.]+; ([^;)]+?)(?: Build|\))/.exec(ua);
  let model = he.model || (m && m[1]) || ''; if (model === 'K' || !model) model = 'non communiqué par le navigateur';
  const gpu = gpuInfo(), est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate().catch(() => null) : null;
  const dpr = window.devicePixelRatio || 1, sw = screen.width, sh = screen.height;
  return [
    ['Identité', [['Modèle', model], ['Android', he.platformVersion ? he.platformVersion : (/Android ([\d.]+)/.exec(ua) || [])[1] || 'inconnu'], ['Architecture', he.architecture ? he.architecture + (he.bitness ? ' ' + he.bitness + ' bits' : '') : 'non exposée'], ['Navigateur', (navigator.userAgentData && navigator.userAgentData.brands ? navigator.userAgentData.brands.filter(b => !/Not.?A/i.test(b.brand)).map(b => b.brand + ' ' + b.version).join(', ') : ua.split(' ').slice(-2).join(' '))]]],
    ['Écran', [['Résolution logique', sw + ' × ' + sh], ['Résolution physique', Math.round(sw * dpr) + ' × ' + Math.round(sh * dpr) + ' px'], ['Densité', dpr.toFixed(2) + '×'], ['Profondeur de couleur', screen.colorDepth + ' bits'], ['Points tactiles max.', String(navigator.maxTouchPoints || 0)], ['Fréquence mesurée', perfData ? perfData.hz + ' Hz' : 'lancez le test Performance']]],
    ['Matériel', [['Cœurs logiques', String(navigator.hardwareConcurrency || '?')], ['Mémoire (arrondie)', navigator.deviceMemory ? '≈ ' + navigator.deviceMemory + ' Go' : 'non exposée'], ['GPU', gpu ? gpu.renderer : 'WebGL indisponible'], ['Quota navigateur', est ? (est.quota / 1e9).toFixed(1) + ' Go' : 'inconnu']]],
    ['Système', [['Langue', navigator.language], ['Fuseau', Intl.DateTimeFormat().resolvedOptions().timeZone], ['Mode installé', matchMedia('(display-mode: standalone)').matches ? 'oui' : 'non'], ['Contexte sécurisé', secure ? 'oui (HTTPS ou localhost)' : 'non : caméra, micro et capteurs bloqués']]]
  ];
}
function apiMatrix() {
  const md = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  return [['Caméra et micro', md && secure], ['Batterie', !!navigator.getBattery], ['Vibration', !!navigator.vibrate], ['Capteurs de mouvement', 'DeviceMotionEvent' in window], ['Géolocalisation', !!navigator.geolocation],
    ['Bluetooth (Web Bluetooth)', !!navigator.bluetooth], ['NFC (Web NFC)', 'NDEFReader' in window], ['Biométrie (WebAuthn)', !!window.PublicKeyCredential], ['Veille écran bloquée', !!navigator.wakeLock], ['Partage natif', !!navigator.share]];
}

/* ---------- vues ---------- */
function pill(st) { return `<span class="pill ${st || ''}">${st ? STATUS[st] : 'À tester'}</span>`; }
function viewHome() {
  const s = summary(), pending = TESTS.filter(t => !results[t.id] || results[t.id].status === 'skip').length;
  const issues = TESTS.filter(t => results[t.id] && (results[t.id].status === 'fail' || results[t.id].status === 'warn')).sort((a, b) => (results[a.id].status === 'fail' ? 0 : 1) - (results[b.id].status === 'fail' ? 0 : 1));
  const col = s.grade ? colorOf(s.grade.cls) : 'var(--muted)';
  return `
  <section class="card hero">${gauge(s.score, s.grade)}
    <div class="meta"><div><h1>${s.grade ? esc(s.grade.label) : 'Diagnostic de votre téléphone'}</h1></div>
    <p>${s.score === null ? `${s.tot} contrôles : écran, tactile, audio, caméras, batterie, capteurs, réseau et performance. Comptez environ 8 minutes.` : `${s.done} contrôle${s.done > 1 ? 's' : ''} sur ${s.tot} réalisé${s.done > 1 ? 's' : ''}.${s.capped ? ' Un composant clé est défaillant : la note est plafonnée à 74.' : ''}`}</p>
    <div class="btn-row"><button class="btn primary" data-act="run-all">${icon('play')} ${s.score === null ? 'Diagnostic complet' : 'Tout relancer'}</button>
    ${s.score !== null && pending ? `<button class="btn" data-act="run-missing">Compléter (${pending})</button>` : ''}</div></div>
  </section>
  ${secure ? '' : `<div class="banner">${icon('warn')}<div><b>Contexte non sécurisé.</b> La caméra, le micro, les capteurs et la batterie sont bloqués par Chrome sur cette adresse. Ouvrez DiagPhone en HTTPS (GitHub Pages) ou via <span class="mono">http://localhost</span> (voir l’onglet Appareil).</div></div>`}
  ${issues.length ? `<section class="sect"><h2>À regarder en priorité</h2><div class="rows">${issues.map(t => `<button class="row" data-act="open:${t.id}"><span class="ic">${icon(t.icon)}</span><span class="tx"><b>${esc(t.title)}</b><span>${esc(results[t.id].detail)}</span></span>${pill(results[t.id].status)}</button>`).join('')}</div></section>` : ''}
  <section class="sect"><h2>Par famille</h2><div class="tiles">${CATS.map(cat => {
    const ts = TESTS.filter(t => t.cat === cat.id), done = ts.filter(t => results[t.id] && results[t.id].status !== 'skip').length;
    return `<button class="tile" data-act="cat:${cat.id}">${icon(ts[0].icon)}<b>${esc(cat.name)}</b><div class="dots">${ts.map(t => `<i class="dot ${results[t.id] ? results[t.id].status : ''}"></i>`).join('')}</div><small>${done} sur ${ts.length} testé${done > 1 ? 's' : ''}</small></button>`;
  }).join('')}</div></section>`;
}
function viewTests() {
  const list = TESTS.filter(t => filterCat === 'all' || t.cat === filterCat);
  return `<section class="sect"><div class="chips" role="group" aria-label="Filtrer par famille"><button class="chipbtn" aria-pressed="${filterCat === 'all'}" data-act="cat:all">Tout</button>${CATS.map(c => `<button class="chipbtn" aria-pressed="${filterCat === c.id}" data-act="cat:${c.id}">${esc(c.name)}</button>`).join('')}</div>
  <div class="rows">${list.map(t => { const r = results[t.id]; return `<button class="row" data-act="open:${t.id}"><span class="ic">${icon(t.icon)}</span><span class="tx"><b>${esc(t.title)}</b><span>${r ? esc(r.detail) : 'Pas encore testé'}</span></span>${pill(r && r.status)}</button>`; }).join('')}</div></section>`;
}
function reportText() {
  const s = summary(), d = new Date();
  const lines = ['DIAGPHONE · Rapport de diagnostic', 'Date : ' + d.toLocaleString('fr-FR'), 'Appareil : ' + (info ? info[0][1][0][1] : 'inconnu') + ' · écran ' + screen.width + '×' + screen.height,
    'Note de santé : ' + (s.score === null ? 'non calculée' : s.score + '/100 (' + s.grade.label + ')') + ' · ' + s.done + '/' + s.tot + ' contrôles', ''];
  for (const t of TESTS) { const r = results[t.id]; lines.push((r ? { pass: '[OK]  ', warn: '[ALERTE]', fail: '[PANNE]', skip: '[----] ' }[r.status] : '[----] ') + ' ' + t.title + ' : ' + (r ? r.detail : 'non testé')); }
  lines.push('', 'Limites : IMEI, capacité réelle de la batterie, boutons physiques, haut-parleur d’appel et capteur de proximité ne sont pas lisibles depuis un navigateur.');
  return lines.join('\n');
}
function spark(hist) {
  if (hist.length < 2) return '';
  const w = 300, hh = 64, pts = hist.map((x, i) => [i / (hist.length - 1) * (w - 12) + 6, hh - 8 - x.score / 100 * (hh - 16)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" role="img" aria-label="Évolution de la note"><polyline fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}"/>${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--accent)"/>`).join('')}</svg>`;
}
function viewReport() {
  const s = summary(), hist = store.get('history', []);
  return `<h2 class="sheet-title">DiagPhone · Fiche d’état</h2>
  <section class="card hero">${gauge(s.score, s.grade, 150)}<div class="meta"><h1>${s.grade ? esc(s.grade.label) : 'Aucun résultat'}</h1><p>${s.score === null ? 'Lancez au moins un test pour générer un rapport.' : `Rapport du ${new Date().toLocaleDateString('fr-FR')}. Les tests non réalisés ne comptent pas dans la note, mais réduisent la couverture : ${s.done}/${s.tot}.`}</p></div></section>
  <section class="sect"><div class="rows">${TESTS.map(t => { const r = results[t.id]; return `<div class="row"><span class="ic">${icon(t.icon)}</span><span class="tx"><b>${esc(t.title)}</b><span>${r ? esc(r.detail) : 'Non testé'}</span></span>${pill(r && r.status)}</div>`; }).join('')}</div></section>
  <section class="sect noprint"><h2>Exporter</h2><div class="btn-row"><button class="btn" data-act="copy-report">Copier</button><button class="btn" data-act="dl-txt">Texte</button><button class="btn" data-act="dl-json">JSON</button><button class="btn" data-act="share">Partager</button><button class="btn" data-act="print">Imprimer / PDF</button></div></section>
  <section class="sect noprint"><h2>Suivi dans le temps</h2><div class="card">${hist.length ? spark(hist) + `<div class="kv" style="margin-top:12px">${hist.slice(-5).reverse().map(x => `<div><span class="k">${new Date(x.ts).toLocaleDateString('fr-FR')} ${new Date(x.ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</span><span class="v">${x.score}/100 · ${x.done} tests</span></div>`).join('')}</div>` : '<p class="muted">Enregistrez ce diagnostic pour suivre l’évolution de la note après chaque mise à jour ou chute.</p>'}
    <div class="btn-row" style="margin-top:12px"><button class="btn primary" data-act="save-hist" ${s.score === null ? 'disabled' : ''}>Enregistrer ce diagnostic</button><button class="btn ghost" data-act="reset">Effacer les résultats</button></div></div></section>`;
}
function viewDevice() {
  const codes = [['*#06#', 'Affiche l’IMEI. À comparer avec la boîte et l’étiquette avant tout achat d’occasion.'], ['*#*#4636#*#*', 'Infos téléphone, réseau et statistiques d’usage (selon la marque).'], ['*#0*#', 'Menu de test matériel sur de nombreux Samsung.']];
  return `<section class="sect"><h2>Votre appareil</h2><div id="infoBox" class="sect">${info ? infoHtml() : '<div class="note">Lecture des informations…</div>'}</div></section>
  <section class="sect"><h2>Ce que le navigateur peut tester ici</h2><div class="kv">${apiMatrix().map(([k, v]) => `<div><span class="k">${esc(k)}</span><span class="v ${v ? 'pass' : 'warn'}">${v ? 'disponible' : 'indisponible'}</span></div>`).join('')}</div></section>
  <section class="sect"><h2>Hors de portée du navigateur</h2><div class="card"><p class="muted">IMEI, capacité réelle et usure de la batterie, boutons de volume et d’alimentation, haut-parleur d’appel, capteur de proximité. Ces codes composés dans l’application Téléphone complètent le diagnostic :</p></div>
  <div class="codes">${codes.map(([c, d]) => `<div class="code"><div><code>${esc(c)}</code><span>${esc(d)}</span></div><button class="btn small" data-act="copy:${esc(c)}">Copier</button></div>`).join('')}</div></section>
  <section class="sect"><h2>Utiliser DiagPhone sur le téléphone</h2><div class="card"><p>Chrome bloque caméra, micro et capteurs hors HTTPS. Deux solutions : publier ce dossier sur GitHub Pages, ou lancer un serveur local sous Termux avec <span class="mono">python -m http.server 8080</span> puis ouvrir <span class="mono">http://localhost:8080</span>. Une fois ouvert, le menu de Chrome propose « Installer l’application ».</p>
  ${deferredInstall ? '<div class="btn-row" style="margin-top:12px"><button class="btn primary" data-act="install">Installer DiagPhone</button></div>' : ''}</div></section>`;
}
function infoHtml() { return info.map(([t, rows]) => `<div><h3 class="sub" style="margin-bottom:8px">${esc(t)}</h3><div class="kv">${rows.map(([k, v]) => `<div><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div></div>`).join(''); }

const NAV = [['home', 'Accueil', 'home'], ['tests', 'Tests', 'list'], ['report', 'Rapport', 'report'], ['device', 'Appareil', 'info']];
function render() {
  $('#nav').innerHTML = NAV.map(([id, l, ic]) => `<button data-act="nav:${id}" ${view === id ? 'aria-current="page"' : ''}>${icon(ic)}<span>${l}</span></button>`).join('');
  $('#view').innerHTML = { home: viewHome, tests: viewTests, report: viewReport, device: viewDevice }[view]();
  const mode = store.get('theme', 'auto'); $('#themeBtn').innerHTML = icon(mode === 'dark' ? 'moon' : mode === 'light' ? 'sun' : 'auto');
  $('#themeBtn').setAttribute('aria-label', 'Thème : ' + { auto: 'automatique', dark: 'sombre', light: 'clair' }[mode]);
  if (view === 'device' && !info) gatherInfo().then(r => { info = r; if (view === 'device') $('#infoBox').innerHTML = infoHtml(); });
}
function applyTheme() {
  const mode = store.get('theme', 'auto'), root = document.documentElement;
  if (mode === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
  const dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('meta[name="theme-color"]').setAttribute('content', dark ? '#0A1315' : '#EEF3F3');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const [act, arg] = [el.dataset.act.split(':')[0], el.dataset.act.split(':').slice(1).join(':')];
  switch (act) {
    case 'nav': view = arg; window.scrollTo(0, 0); render(); break;
    case 'cat': filterCat = arg; view = 'tests'; render(); break;
    case 'open': startTest(arg); break;
    case 'run-all': runSequence(false); break;
    case 'run-missing': runSequence(true); break;
    case 'theme': { const o = ['auto', 'dark', 'light'], cur = store.get('theme', 'auto'); store.set('theme', o[(o.indexOf(cur) + 1) % 3]); applyTheme(); render(); break; }
    case 'copy': copyText(arg); break;
    case 'copy-report': copyText(reportText()); break;
    case 'dl-txt': download('diagphone-rapport.txt', reportText()); break;
    case 'dl-json': download('diagphone-rapport.json', JSON.stringify({ date: new Date().toISOString(), resume: summary(), resultats: results, appareil: info }, null, 2), 'application/json'); break;
    case 'share': if (navigator.share) navigator.share({ title: 'Rapport DiagPhone', text: reportText() }).catch(() => {}); else copyText(reportText()); break;
    case 'print': window.print(); break;
    case 'save-hist': { const s = summary(), hist = store.get('history', []); hist.push({ ts: Date.now(), score: s.score, done: s.done }); store.set('history', hist.slice(-30)); toast('Diagnostic enregistré'); render(); break; }
    case 'reset': results = {}; store.set('results', results); toast('Résultats effacés'); render(); break;
    case 'install': deferredInstall.prompt(); deferredInstall = null; render(); break;
  }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (view === 'device') render(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
applyTheme(); render();
</script>
</body>
